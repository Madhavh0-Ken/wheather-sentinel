[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-nowcast"
version = "0.1.0"
description = "Scientifically honest intense-precipitation nowcasting MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5netcdf>=1.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "requests>=2.32",
  "scikit-image>=0.24",
  "scipy>=1.14",
  "shapely>=2.0",
  "streamlit>=1.39",
  "xarray>=2024.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

